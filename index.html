
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILVA' | Official</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #26000a, #090006 55%, #030303);
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    text-align: center;
}

.container {
    position: relative;
    z-index: 2;
    padding: 75px 20px 40px;
    animation: entrance 1.3s ease;
}

.avatar {
    width: 125px;
    height: 125px;
    margin: auto auto 25px;
    border: 2px solid #ff1744;
    border-radius: 50%;
    padding: 4px;
    box-shadow: 0 0 25px #ff1744;
}

.avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

h1 {
    font-size: clamp(48px, 12vw, 75px);
    letter-spacing: 9px;
    color: #ff1744;
    text-shadow: 0 0 25px #ff1744;
}

.subtitle {
    color: #aaa;
    letter-spacing: 4px;
    font-size: 11px;
    margin-top: 12px;
}

.description {
    color: #999;
    margin: 25px 0;
    font-size: 14px;
}

.section {
    width: min(100%, 350px);
    margin: 35px auto;
    padding: 22px;
    border: 1px solid #641023;
    border-radius: 15px;
    background: #13070bba;
    box-shadow: 0 0 20px #ff17441a;
}

.section h2 {
    color: #ff365b;
    font-size: 17px;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.instagram, .social {
    display: inline-block;
    padding: 14px 27px;
    background: #d0002b;
    color: white;
    text-decoration: none;
    border: 1px solid #ff1744;
    border-radius: 30px;
    font-weight: bold;
    transition: .3s;
}

.instagram:hover, .social:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px #ff1744;
}

.music-frame {
    width: 100%;
    height: 190px;
    border: 1px solid #8e1530;
    border-radius: 12px;
}

.music-note {
    color: #aaa;
    font-size: 12px;
    margin-bottom: 12px;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

footer {
    color: #555;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 30px 10px;
}

/* ARANHA */

.spider-drop {
    position: fixed;
    top: 0;
    right: 25px;
    z-index: 5;
    animation: spider-drop 5s ease-in-out infinite;
}

.web-line {
    width: 1px;
    height: 80px;
    background: #ff1744;
    box-shadow: 0 0 8px red;
    margin: auto;
}

.spider {
    font-size: 36px;
    filter: drop-shadow(0 0 8px red);
    animation: spider-swing 2s ease-in-out infinite alternate;
}

@keyframes spider-drop {
    0%, 100% { transform: translateY(-5px); }
    50% { transform: translateY(45px); }
}

@keyframes spider-swing {
    from { rotate: -15deg; }
    to { rotate: 15deg; }
}

/* TEIAS */

.web {
    position: fixed;
    width: 125px;
    height: 125px;
    opacity: .45;
    z-index: 1;
    pointer-events: none;
}

.web svg {
    width: 100%;
    height: 100%;
}

.web path {
    fill: none;
    stroke: #d71942;
    stroke-width: 1;
}

.web.left {
    top: 0;
    left: 0;
}

.web.right {
    top: 0;
    right: 0;
    transform: scaleX(-1);
}

/* PARTICULAS */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      radial-gradient(#ff1744 1px, transparent 2px),
      radial-gradient(#8b001d 1px, transparent 2px);
    background-size: 90px 110px, 130px 150px;
    animation: particles 15s linear infinite;
    opacity: .35;
}

@keyframes particles {
    from { background-position: 0 0, 30px 50px; }
    to { background-position: 0 -300px, 30px -250px; }
}

@keyframes entrance {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}


/* BOLHA FLUTUANTE DE MUSICA */
.music-bubble {
    position: fixed;
    right: 22px;
    bottom: 28px;
    z-index: 20;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 2px solid #ff365b;
    background: radial-gradient(circle, #35000e, #090006);
    color: white;
    font-size: 27px;
    box-shadow: 0 0 15px #ff1744, 0 0 35px #ff174477;
    cursor: pointer;
    animation: bubble-pulse 2s infinite;
}

@keyframes bubble-pulse {
    50% {
        box-shadow: 0 0 25px #ff1744, 0 0 45px #ff174499;
        transform: scale(1.06);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

/* CAPA DE ENTRADA */
#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 25px;
    background: radial-gradient(ellipse at center, #26000a, #090006 60%, #030303);
    transition: opacity .8s ease, visibility .8s ease;
}
#intro.leaving {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.intro-web {
    position: absolute;
    top: 0;
    width: 150px;
    height: 150px;
    opacity: .55;
    pointer-events: none;
}
.intro-web.left { left: 0; }
.intro-web.right { right: 0; transform: scaleX(-1); }
.intro-web path {
    fill: none;
    stroke: #d71942;
    stroke-width: 1;
}
.intro-spider {
    position: absolute;
    top: 18%;
    right: 12%;
    font-size: 38px;
    filter: drop-shadow(0 0 9px red);
    animation: spider-swing 2s ease-in-out infinite alternate;
}
.intro-title {
    color: #ff1744;
    font-size: clamp(48px, 13vw, 76px);
    letter-spacing: 10px;
    text-shadow: 0 0 25px #ff1744;
}
.intro-subtitle {
    color: #aaa;
    letter-spacing: 5px;
    font-size: 11px;
}
.enter-button {
    margin-top: 22px;
    padding: 19px 58px;
    border: 1px solid #ff5575;
    border-radius: 40px;
    background: linear-gradient(135deg, #ff1744, #a00025);
    color: white;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 3px;
    box-shadow: 0 0 20px #ff1744, 0 0 45px #ff174477;
    cursor: pointer;
    animation: bubble-pulse 2s infinite;
}
.intro-caption {
    color: #777;
    font-size: 11px;
    letter-spacing: 3px;
}
.music-hidden {
    position: fixed;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
}
.music-bubble { display: none; }
body.entered .music-bubble { display: block; }

</style>
</head>

<body>

<div id="intro">
    <div class="intro-web left">
        <svg viewBox="0 0 120 120">
            <path d="M0 0 L120 120 M0 0 L120 40 M0 0 L40 120 M0 0 L120 80 M0 0 L80 120 M20 0 Q20 30 0 40 M50 0 Q50 55 0 80 M80 0 Q80 80 0 110"/>
        </svg>
    </div>
    <div class="intro-web right">
        <svg viewBox="0 0 120 120">
            <path d="M0 0 L120 120 M0 0 L120 40 M0 0 L40 120 M0 0 L120 80 M0 0 L80 120 M20 0 Q20 30 0 40 M50 0 Q50 55 0 80 M80 0 Q80 80 0 110"/>
        </svg>
    </div>
    <div class="intro-spider">🕷️</div>
    <h1 class="intro-title">SILVA'</h1>
    <p class="intro-subtitle">WELCOME TO MY WORLD</p>
    <button class="enter-button" id="enterButton">ENTRAR →</button>
    <p class="intro-caption">🎵 SOUND EXPERIENCE</p>
</div>


<div class="particles"></div>

<div class="web left">
<svg viewBox="0 0 120 120">
<path d="M0 0 L120 120 M0 0 L120 40 M0 0 L40 120 M0 0 L120 80 M0 0 L80 120 M20 0 Q20 30 0 40 M50 0 Q50 55 0 80 M80 0 Q80 80 0 110"/>
</svg>
</div>

<div class="web right">
<svg viewBox="0 0 120 120">
<path d="M0 0 L120 120 M0 0 L120 40 M0 0 L40 120 M0 0 L120 80 M0 0 L80 120 M20 0 Q20 30 0 40 M50 0 Q50 55 0 80 M80 0 Q80 80 0 110"/>
</svg>
</div>

<div class="spider-drop">
    <div class="web-line"></div>
    <div class="spider">🕷️</div>
</div>

<main class="container">

    <div class="avatar">
        <img src="perfil.slv.jpg" alt="Foto do SILVA">
    </div>

    <h1>SILVA'</h1>

    <div class="subtitle">OFFICIAL PERSONAL PAGE</div>

    <p class="description">
        Bem-vindo ao meu universo.
    </p>

    <a class="instagram"
       href="https://www.instagram.com/vitor_sillv44/"
       target="_blank"
       rel="noopener noreferrer">
       ◎ MEU INSTAGRAM
    </a>


    <div class="music-hidden">
        <iframe
          id="musicPlayer"
          src="https://www.youtube.com/embed/HuJOVEaOrmw?enablejsapi=1&playsinline=1"
          title="Música do SILVA"
          allow="autoplay; encrypted-media">
        </iframe>
    </div>


    <section class="section">
        <h2>ABOUT ME</h2>
        <p style="color:#aaa; line-height:1.7;">
            Um pouco de mim, meu espaço e minha identidade.
            <br>
            <span style="color:#ff1744;">SILVAA.</span>
        </p>
    </section>

    <section class="section">
        <h2>MY SOCIALS</h2>
        <div class="socials">
            <a class="social"
               href="https://www.instagram.com/vitor_sillv44/"
               target="_blank">
               Instagram
            </a>
        </div>
    </section>

    <footer>
        © 2026 SILVA' — ALL RIGHTS RESERVED
    </footer>

</main>


<button class="music-bubble" id="musicButton" aria-label="Tocar música">▶</button>

<script>
let musicPlayer;
let musicReady = false;
let musicPlaying = false;

function onYouTubeIframeAPIReady() {
    musicPlayer = new YT.Player('musicPlayer', {
        events: {
            onReady: function() {
                musicReady = true;
                if (wantsMusic) musicPlayer.playVideo();
            },
            onStateChange: function(event) {
                musicPlaying = event.data === YT.PlayerState.PLAYING;
                document.getElementById('musicButton').textContent =
                    musicPlaying ? 'Ⅱ' : '▶';
            }
        }
    });
}

let wantsMusic = false;

document.getElementById('enterButton').addEventListener('click', function() {
    wantsMusic = true;
    document.body.classList.add('entered');
    document.getElementById('intro').classList.add('leaving');

    if (musicReady) {
        musicPlayer.playVideo();
    }
});

document.getElementById('musicButton').addEventListener('click', function() {
    if (!musicReady) return;

    if (musicPlaying) {
        musicPlayer.pauseVideo();
    } else {
        musicPlayer.playVideo();
    }
});

const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.body.appendChild(ytScript);
</script>

</body>
</html>
